name: CI

# On every push to main and every pull request: the tests that need no game
# on Linux, and a build on Windows. The tests with the game run locally; their
# count reaches the README through tools/badges.py. A pull request must come
# from a feature/ or fix/ branch: main's ruleset requires all three checks.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No debug info: it slows the build and swells the cache several times over.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  branch-name:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Only feature/ and fix/ branches merge into main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            feature/*|fix/*) echo "$HEAD_REF may be merged" ;;
            *) echo "::error::$HEAD_REF is neither a feature/ nor a fix/ branch"; exit 1 ;;
          esac

  linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # The dependencies' builds, one cache per job; pull requests read
      # main's and save none of their own, and a failed run keeps its.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install Bevy's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev

      - name: Test
        run: cargo test --workspace --locked

  windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # The dependencies' builds, one cache per job; pull requests read
      # main's and save none of their own, and a failed run keeps its.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Build
        run: cargo build --locked -p a3-app
