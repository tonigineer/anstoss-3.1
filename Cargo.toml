[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
a3-files = { path = "crates/a3-files" }
a3-core = { path = "crates/a3-core" }
a3-screens = { path = "crates/a3-screens" }
bevy = { version = "0.20", default-features = false, features = ["ui", "bevy_audio", "wav"] }
bevy_math = { version = "0.20", default-features = false, features = ["std"] }
# Only the app reads the clock; the game's logic gets it without.
chrono = { version = "0.4.40", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "bmp", "png", "tga"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

# Bevy is unbearably slow at opt-level 0; optimise dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
